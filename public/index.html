<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Vehículos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Gestión de Vehículos</h1>
    <div class="actions">
      <button id="btnAddInspection" class="btn success">+ Nueva Inspección</button>
      <input id="searchInput" type="search" placeholder="Buscar..." />
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn" data-tab="inspections">Inspecciones</button>
  </nav>

  <main class="container">
    <section id="inspections-tab" class="tab-content active">
      <div class="grid" id="inspectionGrid" aria-live="polite"></div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
